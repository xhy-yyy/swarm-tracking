# base6.world 六机地图坐标航线，起点见 start_positions.yaml。
# 公共参数继承 patrol_routes.yaml；entry_waypoints 只走一次，巡航和归航使用闭环。
patrol:
  map: base6
  defaults:
    climb_in_place: false
  routes:
    # 1 号机: SC 南中
    drone_1:
      z: 4.2
      start_delay: 0.0
      entry_waypoints:
        - {x: -13.5, y: -12.0}  # 首段保持原六机格点间距
      waypoints:
        - {x: -13.5, y: -11.3}
        - {x:  43.5, y: -11.3}
        - {x:  43.5, y: -43.5}
        - {x: -13.5, y: -43.5}
    # 2 号机: NC 北中
    drone_2:
      z: 4.2
      start_delay: 0.0
      entry_waypoints:
        - {x: -13.5, y: -9.0}  # 首段保持原六机格点间距
      waypoints:
        - {x: -13.5, y:  -8.3}
        - {x: -13.5, y:  43.5}
        - {x:  43.5, y:  43.5}
        - {x:  43.5, y:  -8.3}
    # 3 号机: NE 北东
    drone_3:
      z: 4.2
      start_delay: 0.0
      entry_waypoints:
        - {x: -13.5, y: -6.0}  # 首段保持原六机格点间距
        - {x: -13.5, y:  -8.3}
      waypoints:
        - {x:  46.5, y:  -8.3}
        - {x:  46.5, y:  43.5}
        - {x: 113.0, y:  43.5}
        - {x: 113.0, y:  -8.3}
    # 4 号机: 整个南部大矩形，逆时针（西 -> 南 -> 东 -> 北）。
    # 主街在 y=-10：沿西侧道路南下后向西入环，进场点只走一次。
    # 主街与相邻巡航航段约 1m；巡航和归航只使用下方四点。
    drone_4:
      z: 4.2
      start_delay: 0.0
      entry_waypoints:
        - {x: -16.500, y: -6.000}
        - {x: -16.500, y: -10.300}
      waypoints:
        - {x: -46.700, y: -10.300}
        - {x: -46.700, y: -46.700}
        - {x: 118.300, y: -46.700}
        - {x: 118.300, y: -10.300}
    # 5 号机: SE 南东
    drone_5:
      z: 4.2
      start_delay: 0.0
      entry_waypoints:
        - {x: -16.5, y: -9.0}  # 首段保持原六机格点间距
        - {x: -13.5, y: -11.3}
      waypoints:
        - {x:  46.5, y: -11.3}
        - {x: 113.0, y: -11.3}
        - {x: 113.0, y: -43.5}
        - {x:  46.5, y: -43.5}
    # 6 号机: 整个北部大矩形，顺时针（北 -> 东 -> 南 -> 西）。
    # 先向东北离开起飞区，再沿西侧道路南下，避开停牌和其他起点。
    # 与 4 号及 2/3 号机的闭环错开；中街间距仍需六机实飞验证。
    drone_6:
      z: 4.2
      start_delay: 0.0
      entry_waypoints:
        - {x: -15.500, y: 6.000}
        - {x: -15.500, y: -9.300}
      waypoints:
        - {x: -46.700, y: -9.300}
        - {x: -46.700, y: 46.700}
        - {x: 118.300, y: 46.700}
        - {x: 118.300, y: -9.300}
